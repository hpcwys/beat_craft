<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BEATCRAFT</title>
<style>
:root{color-scheme:dark;--bg:#080d1c;--pn:#121a33;--ln:#27325a;--tx:#e8ecf8;--mu:#8e97b3;--tl:#19d3c5;--gd:#f5c542;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Pretendard","Noto Sans KR",system-ui,sans-serif}
.w{max-width:760px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
h1{margin:28px 0 4px;font:800 clamp(38px,12vw,64px)/1 "Arial Black",Impact,sans-serif;letter-spacing:2px;color:var(--tl)}
h2{margin:0 0 8px;font-size:19px}
.tag{color:var(--gd);margin:0 0 24px}
.mu{color:var(--mu);font-size:13px}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:12px 16px;min-height:44px;cursor:pointer}
button.p{background:var(--tl);color:#03201d;border:0;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:18px}
.cd{border:2px solid var(--c);border-radius:10px;padding:10px;background:var(--pn)}
.cd b{display:block}.cd small{color:var(--c)}.cd p{margin:4px 0 0;font-size:12px;color:var(--mu)}
.cd.lk{opacity:.35;border-style:dashed}
.st{display:flex;justify-content:space-between;align-items:center;text-align:left;width:100%}
.st[disabled]{opacity:.35}
.star{color:var(--gd);letter-spacing:2px}
#ms{padding:10px 12px;border-left:4px solid var(--gd);background:var(--pn);border-radius:0 10px 10px 0}
#ms.ok{border-color:var(--tl)}
#grid{overflow-x:auto;padding-bottom:6px}
.gl{display:grid;grid-template-columns:78px repeat(16,34px);gap:3px;width:max-content;align-items:center}
.hd{text-align:center;color:var(--mu);font-size:11px}
.lb{position:sticky;left:0;background:var(--bg);font-size:13px;z-index:1;padding-right:4px}
.c{height:34px;min-height:0;padding:0;border-radius:6px;background:#18214a;border:0;font-weight:700;color:#03201d}
.c.b{background:#232e5e}
.c.x{background:var(--tl)}
.c.lk{opacity:.18;cursor:not-allowed}
.c.ph{outline:2px solid var(--gd);outline-offset:1px}
input[type=range]{accent-color:var(--tl);width:130px}
select{font:inherit;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px}
.bar{display:grid;grid-template-columns:130px 1fr 54px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--tl)}
.bar div{background:#18214a;border-radius:5px}
.big{font:800 52px/1 "Arial Black",sans-serif;color:var(--gd)}
button.cd{text-align:left;width:100%;min-height:0}.c.ac{box-shadow:inset 0 0 0 3px var(--gd)}button.cd:disabled{opacity:.4}
input:not([type=range]){font:inherit;padding:12px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx)}
</style></head><body><div class="w">

<section id="home" class="on">
<h1>BEATCRAFT</h1>
<p class="tag">Build Your Rhythm. Create Your Beat.</p>
<div id="acct" class="mu" style="margin:-12px 0 16px"></div>
<div class="col">
<button class="p" onclick="stages()">게임 시작</button>
<button onclick="inf()" style="border-color:var(--gd);color:var(--gd)">INFINITE BEAT · 무한 모드</button>
<button onclick="lbd()">리더보드</button>
<button onclick="coll()">카드 보관함</button>
<button onclick="reset()">설정 · 진행 초기화</button>
</div>
<p class="mu">카드를 모아 16칸 악보에 배치하고, 나만의 드럼 리듬을 완성하세요.</p>
</section>

<section id="col">
<div class="top"><h2>카드 보관함</h2><button onclick="show('home')">메인</button></div>
<div id="cards"></div>
</section>

<section id="stg">
<div class="top"><h2>미션 선택</h2><button onclick="show('home')">메인</button></div>
<div id="stl" class="col"></div>
</section>

<section id="ed">
<div class="top"><h2 id="et"></h2><button onclick="leave()">나가기</button></div>
<div id="ms"></div>
<div class="row">
<button class="p" id="pb" onclick="toggle()">▶ 재생</button>
<button onclick="clr()">지우기</button>
<button class="p" onclick="submit()">평가 받기</button>
</div>
<div id="grid"></div>
<p class="mu">칸을 탭하면 음이 들어가고, 다시 탭하면 기법이 바뀝니다. 카드를 모으면 칸과 기법이 열립니다.</p>
<div class="row" id="ctl"></div>
</section>

<section id="res">
<div class="top"><h2 id="rt"></h2></div>
<div class="big" id="rs"></div>
<div class="star" id="rst"></div>
<div id="rb"></div>
<p id="rm"></p>
<div id="rw"></div>
<div class="row" id="rbt"></div>
</section>
<section id="inf"></section>
<section id="iv"></section>
<section id="lb"></section>

</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const $=s=>document.querySelector(s);
const R=['kick','snare','hat','crash','tom'],RN={kick:'Kick',snare:'Snare',hat:'Hi-hat',crash:'Crash',tom:'Floor Tom'};
const RC={c:['Common','#8e97b3'],r:['Rare','#4a9dff'],e:['Epic','#a15cff'],l:['Legendary','#f5c542']};
const C=[
['kick','Kick','악기','c','베이스 드럼 소리'],['snare','Snare','악기','c','스네어 드럼 소리'],['hat','Hi-hat','악기','c','기본적인 박자 유지'],
['crash','Crash','악기','r','강렬한 악센트'],['tom','Floor Tom','악기','r','낮고 묵직한 타격음'],
['q4','4분음표','리듬','c','1·5·9·13칸 사용'],['q8','8분음표','리듬','c','홀수 칸(1·3·5…) 사용'],
['q16','16분음표','리듬','r','모든 칸 사용'],['syn','싱코페이션','리듬','e','4·8·12·16칸 사용'],
['ghost','Ghost Note','테크닉','r','작고 약한 스네어 (G)'],['flam','Flam','테크닉','e','두 번 거의 동시에 (F)'],
['rim','Rimshot','테크닉','e','테두리와 헤드를 함께 (R)'],['drag','Drag','테크닉','l','짧은 장식음 추가 (D)'],['open','Open Hi-hat','테크닉','r','하이햇을 열어 연주 (O)'],
['bpm','BPM','음악 요소','e','연주 속도 조절'],['groove','Groove','음악 요소','e','흔들리는 스윙 느낌'],
['cres','Crescendo','음악 요소','l','점점 강하게'],['dim','Diminuendo','음악 요소','l','점점 약하게']
];
const CM=Object.fromEntries(C.map(x=>[x[0],x]));
const cnt=(a,r)=>a.filter(x=>x[0]==r).length;
const S=[
['기본 리듬','Kick 4회 이상 사용',a=>cnt(a,'kick')>=4,'crash'],
['백비트','Snare 2회 이상 사용',a=>cnt(a,'snare')>=2,'tom'],
['일정한 박자','Hi-hat 8회 이상 사용',a=>cnt(a,'hat')>=8,'q16'],
['빠른 연주','16분음표 포함 (짝수 칸에 음 배치)',a=>a.some(x=>x[1]%2==1),'syn'],
['리듬 변화','싱코페이션 포함 (4·8·12·16칸에 Hi-hat 외 악기 배치)',a=>a.some(x=>x[0]!='hat'&&x[1]%4==3),'ghost'],
['고급 테크닉','테크닉 2개 이상 사용',a=>a.filter(x=>x[2]!='n').length>=2,'open'],
['화려한 마무리','마지막 박(13~16칸)에 Crash와 Floor Tom 사용',a=>['crash','tom'].every(r=>a.some(x=>x[0]==r&&x[1]>=12)),'rim']
];
let P={o:['kick','snare','hat','q4','q8'],s:{}};
try{const j=JSON.parse(localStorage.getItem('beatcraft1'));if(j&&j.o)P=j}catch(e){}
const save=()=>{try{localStorage.setItem(UK(),JSON.stringify(P))}catch(e){}srvPush()};
let run=null;const O=id=>(run?run.o:P.o).includes(id);
let cur=0,st={g:null,bpm:90,sw:0,dyn:'',playing:0,raf:0,t0:0,sd:0};
const blank=()=>Object.fromEntries(R.map(r=>[r,Array(16).fill('')]));

function show(n){stop();document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==n));scrollTo(0,0)}
function reset(){if(confirm('모든 카드와 진행 상황을 초기화할까요?')){P={o:['kick','snare','hat','q4','q8'],s:{}};save();alert('초기화했습니다.')}}

function coll(){
 let h='';
 ['악기','리듬','테크닉','음악 요소'].forEach(t=>{
  h+=`<h2>${t}</h2><div class="cg">`+C.filter(x=>x[2]==t).map(x=>{const own=O(x[0]);return `<div class="cd${own?'':' lk'}" style="--c:${RC[x[3]][1]}"><small>${RC[x[3]][0]}</small><b>${own?x[1]:'🔒 '+x[1]}</b><p>${x[4]}</p></div>`}).join('')+'</div>'});
 $('#cards').innerHTML=h+`<p class="mu">보유 ${P.o.length} / ${C.length}장 · 스테이지를 클리어하면 새 카드를 얻고, 별 3개를 받으면 보너스 카드가 하나 더 나옵니다.</p>`;
 show('col')}

function stages(){
 $('#stl').innerHTML=S.map((s,i)=>{const lock=i>0&&!P.s[i-1],n=P.s[i]||0;
  return `<button class="st" ${lock?'disabled':''} onclick="start(${i})"><span><b>STAGE ${i+1} · ${s[0]}</b><br><span class="mu">${s[1]}</span></span><span class="star">${lock?'🔒':'★'.repeat(n)+'☆'.repeat(3-n)}</span></button>`}).join('');
 show('stg')}

function start(i){
 cur=i;st.g=blank();st.sw=0;st.dyn='';
 $('#et').textContent=`STAGE ${i+1} · ${S[i][0]}`;
 const sw=O('groove')?'<label>Groove <input type="range" min="0" max="0.6" step="0.05" value="0" oninput="st.sw=+this.value"></label>':'';
 const bp=O('bpm')?`<label>BPM <input type="range" min="60" max="140" value="90" oninput="st.bpm=+this.value;this.nextSibling.textContent=this.value"><span>90</span></label>`:'<span class="mu">90 BPM 고정 (BPM 카드로 조절)</span>';
 const dy=(O('cres')||O('dim'))?`<select onchange="st.dyn=this.value"><option value="">강약 없음</option>${O('cres')?'<option value="cres">Crescendo</option>':''}${O('dim')?'<option value="dim">Diminuendo</option>':''}</select>`:'';
 st.bpm=90;st.tm=0;st.am=0;st.t=blank12();st.acc=new Set();$('#ctl').innerHTML=bp+sw+dy+(O('t3')?'<button id="tmb" onclick="tmode()">격자: 16분</button>':'')+(O('accent')?'<button id="acb" onclick="am()">Accent 모드: 꺼짐</button>':'');
 draw();show('ed')}

const al=i=>O('q16')||(O('q4')&&i%4==0)||(O('q8')&&i%2==0)||(O('syn')&&i%4==3);
function vars(r){const a=['n'];if(r=='snare'){O('ghost')&&a.push('g');O('flam')&&a.push('f');O('rim')&&a.push('r');O('drag')&&a.push('d')}if(r=='hat'&&O('open'))a.push('o');return a}
function notes(){const a=[];R.forEach(r=>{st.g[r].forEach((v,i)=>v&&a.push([r,i,v]));st.t[r].forEach((v,j)=>v&&a.push([r,j*4/3,v,1]))});return a}
function draw(){
 const N=st.tm?12:16,G=st.tm?st.t:st.g;let h=`<div class="gl" style="grid-template-columns:78px repeat(${N},34px)"><span></span>`+[...Array(N)].map((_,i)=>`<small class="hd">${i+1}</small>`).join('');
 R.forEach(r=>{h+=`<b class="lb">${O(r)?'':'🔒'}${RN[r]}</b>`;
  for(let i=0;i<N;i++){const v=G[r][i],ok=O(r)&&(st.tm||al(i));h+=`<button class="c${i%(st.tm?3:4)?'':' b'}${v?' x':''}${st.acc.has(r+(st.tm?'t':'g')+i)?' ac':''}${ok?'':' lk'}" data-i="${i}" data-r="${r}" aria-label="${RN[r]} ${i+1}칸">${v?(v=='n'?'●':v.toUpperCase()):''}</button>`}});
 $('#grid').innerHTML=h+'</div>';chk()}
function chk(){if(run)return ichk();const ok=S[cur][2](notes());const m=$('#ms');m.className=ok?'ok':'';m.textContent=(ok?'✔ 미션 달성: ':'○ 미션: ')+S[cur][1]}
$('#grid').addEventListener('click',e=>{
 const b=e.target.closest('.c');if(!b)return;
 const r=b.dataset.r,i=+b.dataset.i;if(!O(r)||!(st.tm||al(i)))return;const G=st.tm?st.t:st.g,ak=r+(st.tm?'t':'g')+i;if(st.am){if(G[r][i]){st.acc.has(ak)?st.acc.delete(ak):st.acc.add(ak);draw()}return}
 const a=vars(r),c=G[r][i],k=c?a.indexOf(c):-1,nx=k+1<a.length?a[k+1]:'';
 G[r][i]=nx;if(!nx)st.acc.delete(ak);if(nx){const c0=ac();hit(c0,c0.currentTime,r,nx,1)}
 draw()});
function clr(){stop();st.g=blank();st.t=blank12();st.acc=new Set();draw()}

/* audio */
let A,M,NB;
function ac(){if(!A){A=new(window.AudioContext||window.webkitAudioContext)();M=A.createGain();M.connect(A.destination);NB=A.createBuffer(1,A.sampleRate*1.5,A.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(A.state=='suspended')A.resume();return A}
function hit(c,t,r,v,g){
 const env=(n,a,d)=>{n.gain.setValueAtTime(Math.max(a*g,.001),t);n.gain.exponentialRampToValueAtTime(.001,t+d)};
 const tone=(f1,f2,d,a)=>{const s=c.createOscillator(),n=c.createGain();s.frequency.setValueAtTime(f1,t);s.frequency.exponentialRampToValueAtTime(f2,t+d);env(n,a,d);s.connect(n).connect(M);s.start(t);s.stop(t+d+.02)};
 const noise=(d,a,f,ty)=>{const s=c.createBufferSource(),fl=c.createBiquadFilter(),n=c.createGain();s.buffer=NB;fl.type=ty;fl.frequency.value=f;env(n,a,d);s.connect(fl).connect(n).connect(M);s.start(t,Math.random()*.2,d+.05)};
 if(r=='kick')tone(150,42,.32,1);
 else if(r=='tom')tone(115,48,.45,.9);
 else if(r=='hat')noise(v=='o'?.4:.07,.35,7000,'highpass');
 else if(r=='crash')noise(1.2,.45,5000,'highpass');
 else{
  const snare=(tt,gg,q)=>{const a=v=='g'?.22:v=='r'?1.1:.7;const s0=t;t=tt;const g0=g;g=g0*gg;noise(.16,a,v=='r'?3200:1800,'bandpass');tone(230,130,.1,a*.6);t=s0;g=g0};
  if(v=='f'){snare(t-.03,.5)}else if(v=='d'){snare(t-.07,.4);snare(t-.035,.5)}
  snare(t,1)}
}
function stop(){st.playing=0;cancelAnimationFrame(st.raf);document.querySelectorAll('.ph').forEach(e=>e.classList.remove('ph'));if(A){M.disconnect();M=A.createGain();M.connect(A.destination)}const b=$('#pb');if(b)b.textContent='▶ 재생'}
function toggle(){if(st.playing){stop();return}play()}
function play(){
 const c=ac();stop();
 const sd=60/st.bpm/4,t0=c.currentTime+.12;st.t0=t0;st.sd=sd;
 for(let k=0;k<32;k++){const i=k%16,t=t0+k*sd+(i%2?st.sw*sd:0);let g=1;
  if(st.dyn=='cres')g=.35+.65*k/31;if(st.dyn=='dim')g=1-.65*k/31;
  R.forEach(r=>{const v=st.g[r][i];if(v)hit(c,Math.max(t,c.currentTime),r,v,g*(st.acc.has(r+'g'+i)?1.4:1))})}
 for(let k=0;k<24;k++){const j=k%12,t=t0+k*sd*4/3;let g=1;if(st.dyn=='cres')g=.35+.65*k/23;if(st.dyn=='dim')g=1-.65*k/23;R.forEach(r=>{const v=st.t[r][j];if(v)hit(c,Math.max(t,c.currentTime),r,v,g*(st.acc.has(r+'t'+j)?1.4:1))})}
 st.playing=1;$('#pb').textContent='■ 정지';tick()}
function tick(){
 if(!st.playing)return;
 const s=Math.floor((A.currentTime-st.t0)/st.sd);
 if(s>=32){stop();return}
 document.querySelectorAll('.ph').forEach(e=>e.classList.remove('ph'));
 if(s>=0)document.querySelectorAll('#grid [data-i="'+(st.tm?Math.floor(s%16*3/4):s%16)+'"]').forEach(e=>e.classList.add('ph'));
 st.raf=requestAnimationFrame(tick)}

/* score */
function score(a){
 const hat=cnt(a,'hat'),g=st.g;
 const hs=g.hat.map((v,i)=>v?i:-1).filter(i=>i>=0),steady=hs.length>=8&&(hs.every(i=>i%2==0)||hs.length>=14),clean=cnt(a,'kick')>0&&g.kick.every((v,i)=>!(v&&g.snare[i]));
 const t=(g.kick[0]?5:0)+(g.kick[8]?3:0)+(g.snare[4]?4:0)+(g.snare[12]?4:0)+(steady?5:Math.min(4,hs.length/2))+(clean?4:0);
 const a16=a.filter(x=>!x[3]),v=Math.min(20,new Set(a16.map(x=>x[1]%4)).size*3+(a16.some(x=>x[0]!='hat'&&x[1]%4==3)?4:0)+(a.some(x=>x[3])?4:0));
 const ins=R.reduce((s,r)=>{const c=cnt(a,r),m={kick:3,snare:3,hat:8,crash:2,tom:2}[r];return s+(c?2:0)+(c>=m?2:0)},0);
 const tv=a.filter(x=>x[2]!='n'),tc=Math.min(20,new Set(tv.map(x=>x[2])).size*5+(tv.length>=4?5:0));
 const n=a.length,mu=(n>=12&&n<=32?5:n>=8?2:0)+(a.some(x=>(x[0]=='crash'||x[0]=='tom')&&x[1]>=12)?3:0)+(cnt(a,'kick')>=3?2:0)+(a.filter(x=>x[1]>=8).length>=3?3:0)+(st.acc.size>=2||st.dyn?2:0);
 return [['Timing Accuracy',t,25],['Rhythm Variety',v,20],['Instrument Use',ins,20],['Technique',tc,20],['Musical Completeness',mu,15]].map(x=>[x[0],Math.round(x[1]),x[2]])}

function submit(){if(run)return rsub();
 stop();const a=notes(),sc=score(a),base=sc.reduce((s,x)=>s+x[1],0),ok=S[cur][2](a),tot=Math.min(100,base+(ok?5:0));
 const stars=ok?(tot>=90?3:tot>=70?2:1):0,got=[];
 if(ok){
  if(stars>(P.s[cur]||0))P.s[cur]=stars;
  const rw=S[cur][3];if(!O(rw)){P.o.push(rw);got.push(rw)}
  if(stars==3){const l=C.map(x=>x[0]).filter(x=>!O(x));if(l.length){const x=l[Math.random()*l.length|0];P.o.push(x);got.push(x)}}
  save()}
 $('#rt').textContent=`STAGE ${cur+1} · ${S[cur][0]}`;
 $('#rs').textContent=tot+'점';
 $('#rst').textContent=ok?'★'.repeat(stars)+'☆'.repeat(3-stars):'미션 실패';
 $('#rb').innerHTML=sc.map(x=>`<div class="bar"><span>${x[0]}</span><div><i style="width:${x[1]/x[2]*100}%"></i></div><span>${x[1]}/${x[2]}</span></div>`).join('');
 $('#rm').textContent=ok?'미션 달성! 추가 점수 +5':'미션 미달성: '+S[cur][1];
 $('#rw').innerHTML=got.length?'<h2>새 카드 획득</h2><div class="cg">'+got.map(id=>{const x=CM[id];return `<div class="cd" style="--c:${RC[x[3]][1]}"><small>${RC[x[3]][0]}</small><b>${x[1]}</b><p>${x[4]}</p></div>`}).join('')+'</div>':'';
